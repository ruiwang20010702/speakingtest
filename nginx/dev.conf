# 开发环境 Nginx 配置
# 使用方法: nginx -c $(pwd)/nginx/dev.conf
# 或者: ln -s $(pwd)/nginx/dev.conf /opt/homebrew/etc/nginx/servers/speakingtest.conf

# 统一入口: http://localhost:8080
# - /api/*          -> 后端 API (8000)
# - /s/*            -> 学生端 H5 (3001)
# - /p/* 或 /parent/* -> 家长端 H5 (3000)
# - /t/* 或 /teacher/* -> 老师端 Web (5173)

upstream backend {
    server 127.0.0.1:8000;
}

upstream student_h5 {
    server 127.0.0.1:3001;
}

upstream parent_h5 {
    server 127.0.0.1:3000;
}

upstream teacher_web {
    server 127.0.0.1:5173;
}

server {
    listen 8080;
    server_name localhost;

    # 日志
    access_log /tmp/speakingtest_access.log;
    error_log /tmp/speakingtest_error.log;

    # 后端 API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持 (如果需要)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时配置 (评测可能耗时较长)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 学生端 H5 - /s/ 路径
    location /s/ {
        proxy_pass http://student_h5/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Vite HMR WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 家长端 H5 - /p/ 或 /parent/ 路径
    location ~ ^/(p|parent)/ {
        rewrite ^/(p|parent)/(.*)$ /$2 break;
        proxy_pass http://parent_h5;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Vite HMR WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 老师端 Web - /t/ 或 /teacher/ 路径
    location ~ ^/(t|teacher)/ {
        rewrite ^/(t|teacher)/(.*)$ /$2 break;
        proxy_pass http://teacher_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Vite HMR WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 默认首页 - 重定向到学生端
    location = / {
        return 302 /s/;
    }
}
