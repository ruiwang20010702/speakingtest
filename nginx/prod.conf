# 生产环境 Nginx 配置
# 
# 部署说明:
# 1. 前端静态文件已构建并部署到指定目录 (或使用 CDN)
# 2. 后端 API 使用 gunicorn/uvicorn 运行
# 3. 根据实际情况修改域名、证书路径、静态文件路径

# 后端 API 集群 (可配置多个实例)
upstream backend_cluster {
    least_conn;  # 最少连接负载均衡
    server 127.0.0.1:8000 weight=1;
    # server 127.0.0.1:8001 weight=1;  # 可扩展更多实例
    
    keepalive 32;  # 保持长连接
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com *.your-domain.com;
    return 301 https://$host$request_uri;
}

# 主服务 - 学生端 (student.your-domain.com)
server {
    listen 443 ssl http2;
    server_name student.your-domain.com;

    # SSL 证书 (使用 Let's Encrypt 或购买证书)
    ssl_certificate /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志
    access_log /var/log/nginx/student_access.log;
    error_log /var/log/nginx/student_error.log;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 后端 API
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
    }

    # 健康检查 (供负载均衡器使用)
    location /health {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 前端静态文件 (已构建的 dist 目录)
    location / {
        root /var/www/speakingtest/student-h5/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

