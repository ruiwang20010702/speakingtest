# ============================================
# AI Speaking Test - Nginx Configuration
# ============================================

# Upstream for FastAPI backend
upstream api_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Main server block
server {
    listen 80 default_server;
    server_name _;

    # ============================================
    # API Proxy (Backend)
    # ============================================
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;

        # For file uploads
        client_max_body_size 50M;
    }

    # Health check endpoint (direct proxy)
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # OpenAPI docs
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================
    # Student H5 (Mobile Web)
    # Path: /s/*
    # ============================================
    location /s/ {
        alias /var/www/student-h5/;
        try_files $uri $uri/ /s/index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # Parent H5 (Report Viewer)
    # Path: /p/*
    # ============================================
    location /p/ {
        alias /var/www/parent-h5/;
        try_files $uri $uri/ /p/index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # Teacher Web (Admin Dashboard)
    # Path: / (default)
    # ============================================
    location / {
        root /var/www/teacher-web;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # Static assets (shared)
    # ============================================
    location /assets/ {
        root /var/www/teacher-web;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        root /var/www/teacher-web;
        expires 30d;
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        root /var/www/teacher-web;
        log_not_found off;
        access_log off;
    }
}
